name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Явно разрешить публикацию обоих образов и релиза выбранного тега'
        type: boolean
        required: true
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    strategy:
      matrix:
        backend: [awg, wg]
    env:
      IMAGE_NAME: ${{ github.repository }}-${{ matrix.backend }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Проверить успешный CI для точного commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow test.yml --limit 100 --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          test "$passed" -gt 0

      - name: Verify release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          state_version="$(tr -d '\r\n' < STATE_VERSION)"
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
          test "$(node -p "require('./src/package.json').version")" = "$version"
          grep -Fq "ghcr.io/a-baader/awg-easy-3-awg:$version" docker-compose.dual.yml
          grep -Fq "ghcr.io/a-baader/awg-easy-3-wg:$version" docker-compose.dual.yml
          grep -Fq "const STATE_VERSION = $state_version;" src/lib/StateStore.js
          if [[ "$version" == *-* ]]; then
            echo 'is_stable=false' >> "$GITHUB_OUTPUT"
          else
            echo 'is_stable=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Test before publishing
        working-directory: src
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run check
          sh -n ../install.sh
          sh -n ../awg-easy-3
          sh -n ../lib/auto-update.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.release.outputs.is_stable == 'true' }}

      - name: Build and push Docker image
        id: published
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          target: ${{ matrix.backend }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Сохранить digest образа
        env:
          IMAGE_DIGEST: ${{ steps.published.outputs.digest }}
          IMAGE_BACKEND: ${{ matrix.backend }}
        run: |
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          Path('image-digest.json').write_text(json.dumps({'backend':os.environ['IMAGE_BACKEND'],'digest':os.environ['IMAGE_DIGEST']})+'\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.backend }}
          path: image-digest.json

  release:
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: image-digests
      - name: Собрать manifest и инструкции по digest
        run: |
          mkdir -p merged-digests
          cp image-digests/image-digest-awg/image-digest.json merged-digests/awg.json
          cp image-digests/image-digest-wg/image-digest.json merged-digests/wg.json
          python3 scripts/prepare-release-assets.py --digests merged-digests --output release-assets --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
      - name: Publish release notes after the image is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "$GITHUB_REF_NAME" in
            *-rc.*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          if existing=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease 2>/dev/null); then
            test "$existing" = "$prerelease"
          elif [ "$prerelease" = true ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --prerelease --latest=false \
              --title "VPN Easy Dual $GITHUB_REF_NAME — предварительный выпуск" \
              --notes-file release-assets/notes.md
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --latest \
              --title "VPN Easy Dual $GITHUB_REF_NAME" \
              --notes-file release-assets/notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            release-assets/release-manifest.json release-assets/install-command.txt release-assets/SHA256SUMS --clobber
