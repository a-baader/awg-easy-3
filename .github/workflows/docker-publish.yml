name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Явно разрешить публикацию обоих образов и релиза выбранного тега'
        type: boolean
        required: true
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    concurrency: release-${{ github.ref }}-${{ matrix.backend }}
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    strategy:
      matrix:
        backend: [awg, wg]
    env:
      IMAGE_NAME: ${{ github.repository }}-${{ matrix.backend }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4

      - name: Найти успешный полный CI для точного commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow test.yml --status success --limit 100 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id" && test "$run_id" != null
          echo "CI_RUN_ID=$run_id" >> "$GITHUB_ENV"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Ошибка: релиз уже существует; повторная публикация запрещена' >&2
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name tested-images --dir tested-images

      - name: Verify release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          state_version="$(tr -d '\r\n' < STATE_VERSION)"
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
          test "$(node -p "require('./src/package.json').version")" = "$version"
          grep -Fq "ghcr.io/a-baader/wg-dual-easy-awg:$version" docker-compose.dual.yml
          grep -Fq "ghcr.io/a-baader/wg-dual-easy-wg:$version" docker-compose.dual.yml
          grep -Fq "const STATE_VERSION = $state_version;" src/lib/StateStore.js
          if [[ "$version" == *-* ]]; then
            echo 'is_stable=false' >> "$GITHUB_OUTPUT"
          else
            echo 'is_stable=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Test before publishing
        working-directory: src
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run check
          sh -n ../install.sh
          sh -n ../awg-easy-3
          sh -n ../lib/auto-update.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Опубликовать проверенный образ без пересборки
        id: published
        run: |
          python3 scripts/release-tested-images.py publish --directory tested-images \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --backend '${{ matrix.backend }}' --version "$(cat VERSION)" --output image-digest.json
      - name: Подписать provenance опубликованного digest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.backend }}
          path: image-digest.json

  release:
    concurrency: release-final-${{ github.ref }}
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digest-*
          path: image-digests
      - name: Собрать manifest и инструкции по digest
        run: |
          mkdir -p merged-digests
          cp image-digests/image-digest-awg/image-digest.json merged-digests/awg.json
          cp image-digests/image-digest-wg/image-digest.json merged-digests/wg.json
          python3 scripts/prepare-release-assets.py --digests merged-digests --output release-assets --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
      - name: Проверить анонимный доступ к обоим образам до создания релиза
        run: python3 scripts/check-release-images.py release-assets/release-manifest.json
      - name: Publish release notes after the image is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "$GITHUB_REF_NAME" in
            *-rc.*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "wg-dual-easy $GITHUB_REF_NAME" --notes-file release-assets/notes.md
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            release-assets/release-manifest.json release-assets/install-command.txt release-assets/TEST_REPORT.ru.md release-assets/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$prerelease" --latest="$([ "$prerelease" = false ] && echo true || echo false)"
      - name: Обновить latest только после публикации полного stable-релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in *-rc.*) exit 0 ;; esac
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 - <<'PYCODE'
          import json,subprocess
          from pathlib import Path
          for name,reference in json.loads(Path('release-assets/release-manifest.json').read_text())['images'].items():
              subprocess.run(['docker','pull',reference],check=True)
              latest=reference.split('@')[0]+':latest'
              subprocess.run(['docker','tag',reference,latest],check=True)
              subprocess.run(['docker','push',latest],check=True)
          PYCODE
      - name: Продвинуть master только после готовности stable-релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-rc.*) exit 0 ;; esac
          python3 scripts/promote-stable-release.py --repository "$GITHUB_REPOSITORY" \
            --version "$(cat VERSION)" --commit "$GITHUB_SHA"
