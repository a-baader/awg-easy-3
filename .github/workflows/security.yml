name: Security

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Проверить точные образы опубликованного stable-релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir release-metadata
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          images = json.loads(Path('release-metadata/release-manifest.json').read_text())['images']
          subprocess.run(['python3', 'scripts/scan-release-images.py', *images.values()], check=True)
          PY
      - name: Сохранить отчёты, включая найденные уязвимости
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-report
          path: security-report
          if-no-files-found: warn
