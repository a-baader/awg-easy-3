name: Test

on:
  push:
    branches:
      - master
      - feature/vpn-easy-dual
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run check
      - name: Check POSIX shell syntax
        run: |
          sh -n ../install.sh
          sh -n ../awg-easy-3
          sh -n ../lib/auto-update.sh
          sh -n ../vpnctl
          sh -n ../lib/dual-dependencies.sh
      - name: Проверки host manager без изменения хоста
        run: |
          python3 ../scripts/test-vpnctl.py
          python3 ../scripts/test-vpnctl-install-contract.py
          python3 ../scripts/test-vpnctl-purge.py
          python3 ../scripts/test-vpnctl-source-update.py
          python3 ../scripts/test-dual-preflight.py
          python3 -m py_compile ../lib/vpnctl_manager.py ../lib/vpnctl_backup.py ../lib/vpnctl_common.py

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: awg-easy-3:test
      - name: Smoke-test the built image without host network privileges
        run: |
          test "$(docker run --rm --network none --entrypoint node awg-easy-3:test -p 'require("/app/package.json").version')" = "$(cat VERSION)"
          docker run --rm --network none --entrypoint awg awg-easy-3:test --version
          docker run --rm --network none --entrypoint nft awg-easy-3:test --version
      - name: Test real AWG upgrade with previous-release clients
        run: |
          sudo modprobe tun
          node scripts/test-awg-upgrade.cjs awg-easy-3:test
      - name: Verify GeoIP and IP-family packet policies in an isolated namespace
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y nftables
          docker run --rm --network none --entrypoint node awg-easy-3:test \
            /app/test/helpers/ip-family-policies.js | \
            sudo unshare --net python3 src/test/helpers/verify-ip-families-linux.py
      - name: Build pinned upstream regression-test environment
        uses: docker/build-push-action@v6
        with:
          context: .
          target: awg-go
          platforms: linux/amd64
          push: false
          load: true
          tags: awg-easy-3:engine-tests
      - name: Check upstream padding and disabled-cookie regressions
        run: |
          docker run --rm --network none \
            -v "$PWD/scripts/awg-regression_test.go:/src/device/easy_regression_test.go:ro" \
            --entrypoint go awg-easy-3:engine-tests \
            test ./device -run '^TestEasy' -count=5 -timeout=2m

  dual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: awg
          platforms: linux/amd64
          push: false
          load: true
          tags: vpn-easy-awg:dual-stage7
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: wg
          platforms: linux/amd64
          push: false
          load: true
          tags: vpn-easy-wg:dual-stage7
      - name: Проверка стандартных WG tools и Compose
        run: |
          docker run --rm --network none --entrypoint wg vpn-easy-wg:dual-stage7 --version
          docker run --rm --network none --entrypoint wireguard-go vpn-easy-wg:dual-stage7 --version
          docker run --rm --network none --entrypoint sh vpn-easy-wg:dual-stage7 -c '! command -v awg && ! command -v amneziawg-go'
          docker compose -f docker-compose.dual.yml config -q
          sudo modprobe tun
      - name: Dual packet tests в одноразовой сети
        run: node scripts/test-dual-network.cjs vpn-easy-awg:dual-stage7 vpn-easy-wg:dual-stage7
      - name: Host manager, миграция и аварийное восстановление
        env:
          TEST_AWG_IMAGE: vpn-easy-awg:dual-stage7
          TEST_WG_IMAGE: vpn-easy-wg:dual-stage7
        run: |
          python3 scripts/test-dependency-bootstrap.py
          sudo -E python3 scripts/test-vpnctl-integration.py
          sudo -E python3 scripts/test-vpnctl-migration.py
          sudo -E python3 scripts/test-vpnctl-recovery.py
          sudo -E python3 scripts/test-vpnctl-packet-probes.py
          sudo -E python3 scripts/test-vpnctl-uninstall.py
          sudo -E python3 scripts/test-vpnctl-reinstall.py
          sudo -E python3 scripts/test-vpnctl-purge-integration.py
          sudo -E python3 scripts/test-vpnctl-source-update-integration.py
      - name: Браузерная проверка через настоящие Home VPN
        env:
          TEST_AWG_IMAGE: vpn-easy-awg:dual-stage7
          TEST_WG_IMAGE: vpn-easy-wg:dual-stage7
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
          BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/vpn-browser-artifacts
        run: |
          npm ci --prefix scripts/browser --ignore-scripts
          npm exec --prefix scripts/browser -- playwright install --with-deps chromium
          export BROWSER_NODE="$(command -v node)"
          sudo -E python3 scripts/test-vpnctl-browser.py
          sudo chown -R "$(id -u):$(id -g)" "$BROWSER_ARTIFACT_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: ${{ runner.temp }}/vpn-browser-artifacts
